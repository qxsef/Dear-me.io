<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Anonim — RuangBebas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo">💜 RuangBebas</a>
    <div class="nav-links">
      <a href="index.html">Beranda</a>
      <a href="chat.html" class="active">Chat Anonim</a>
      <a href="diary.html">Diary Pribadi</a>
    </div>
  </div>
</nav>

<main class="container chat-layout">
  <aside class="profile-panel">
    <h3>Profil Anonim Lo</h3>
    <div class="pfp-wrap">
      <img id="myPfp" src="https://api.dicebear.com/9.x/thumbs/svg?seed=RuangBebas" alt="pfp">
      <label for="pfpInput" class="pfp-btn">📷 Ganti PFP</label>
      <input type="file" id="pfpInput" accept="image/*" hidden>
    </div>
    <label class="lbl">Nama samaran (tampil di chat):</label>
    <input type="text" id="myName" maxlength="20" placeholder="cth: SenjaUngu">
    <button class="btn-primary full" onclick="saveProfile()">Simpan Profil</button>
    <p class="hint">PFP & nama kesimpen otomatis di browser. Orang lain bakal liat nama + PFP lo di tiap pesan.</p>
    <hr>
    <button class="btn-danger full" onclick="clearChat()">🗑️ Hapus Semua Chat</button>
  </aside>

  <section class="chat-panel">
    <div class="chat-head">
      <div><h2>💬 Chat Anonim Publik</h2><span class="online"><span class="dot"></span> semua orang bisa akses & nulis</span></div>
    </div>
    <div id="chatBox" class="chat-box"></div>
    <div class="chat-input-bar">
      <label for="chatImg" class="img-btn" title="Kirim gambar">🖼️</label>
      <input type="file" id="chatImg" accept="image/*" hidden>
      <img id="imgPreview" class="img-preview" style="display:none">
      <input type="text" id="chatText" placeholder="Tulis sesuatu dengan bebas... (Enter untuk kirim)" autocomplete="off">
      <button class="btn-primary" onclick="sendChat()">Kirim</button>
    </div>
  </section>
</main>

<footer>💜 RuangBebas • Jadilah bebas, tetap sopan.</footer>
<script src="app.js"></script>
<script>initChat();</script>
