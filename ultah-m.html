<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Untuk Mita 💜</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}[hidden]{display:none!important}
body{font-family:system-ui,sans-serif;color:#4b2e83;background:linear-gradient(160deg,#ffd6ec,#d8c4f4 55%,#b99ae8);overflow:hidden;display:grid;place-items:center;text-align:center}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.blob{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(60px);opacity:.55;animation:dr 18s ease-in-out infinite alternate}
.blob:nth-child(1){background:#ffb3d9;left:-20vmax;top:-20vmax}
.blob:nth-child(2){background:#b99ae8;right:-25vmax;top:10vh;animation-duration:22s}
.blob:nth-child(3){background:#ffe3b3;left:10vw;bottom:-30vmax;animation-duration:26s}
@keyframes dr{to{transform:translate(10vw,8vh) scale(1.2)}}
canvas{position:fixed;inset:0;pointer-events:none;z-index:5}
.st{position:fixed;color:#fff;opacity:.8;animation:tw 3s infinite alternate;pointer-events:none;z-index:0}
@keyframes tw{to{opacity:.15;transform:scale(1.5)}}
.pt{position:fixed;top:-40px;z-index:1;pointer-events:none;opacity:.85;animation:fall linear infinite}
@keyframes fall{to{transform:translate(50px,115vh) rotate(360deg)}}
.ss{position:fixed;width:90px;height:2px;background:linear-gradient(90deg,#fff,transparent);z-index:0;pointer-events:none;animation:sh 1.1s linear forwards}
@keyframes sh{from{opacity:1;transform:translate(0,0) rotate(-30deg)}to{opacity:0;transform:translate(-60vw,35vh) rotate(-30deg)}}
.mute{position:fixed;top:12px;right:12px;z-index:9;border:0;background:rgba(255,255,255,.75);border-radius:50%;width:42px;height:42px;font-size:1.2rem;cursor:pointer}
.scene{display:none;padding:18px;max-width:480px;width:100%;position:relative;z-index:2}.scene.on{display:block}
h1{font-size:clamp(1.7rem,8vw,2.6rem);margin:.2em 0;line-height:1.2}
.big{font-size:clamp(1.3rem,6vw,1.9rem)}
.btn{border:0;background:#9575cd;color:#fff;padding:14px 26px;border-radius:99px;font-weight:600;font-size:1.05rem;font-family:inherit;box-shadow:0 8px 20px rgba(103,70,154,.35);cursor:pointer;margin-top:14px;transition:transform .15s}.btn:active{transform:scale(.94)}
.chibi{width:min(58vw,230px);height:auto;filter:drop-shadow(0 10px 14px rgba(103,70,154,.3))}
.bob{animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}
.eyes{transform-origin:100px 108px;animation:bl 4s infinite}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.wave{transform-origin:136px 160px;animation:wv .6s infinite alternate ease-in-out}@keyframes wv{to{transform:rotate(-28deg)}}
.bub{position:relative;background:#fff;border-radius:22px;padding:16px 18px;margin:6px auto 0;min-height:92px;display:grid;place-items:center;font-size:1.08rem;line-height:1.5;box-shadow:0 8px 24px rgba(103,70,154,.2)}
.bub:before{content:"";position:absolute;top:-12px;left:50%;margin-left:-12px;border:12px solid transparent;border-top:0;border-bottom-color:#fff}
.cake{font-size:5.5rem;line-height:1;cursor:pointer;user-select:none;margin:6px 0}.cake:active{transform:scale(.92)}
.flame{display:inline-block;font-size:2.4rem;animation:fl .4s infinite alternate}@keyframes fl{to{transform:scale(1.15) rotate(6deg)}}
.b{position:fixed;bottom:-80px;font-size:2.6rem;animation:up linear forwards;pointer-events:none;z-index:4}@keyframes up{to{transform:translateY(-120vh)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
body{background:linear-gradient(180deg,#7a62c9 0%,#c79bea 30%,#ff9ec4 62%,#ffd9b0 88%)}
.sun{position:absolute;left:50%;bottom:26vh;width:42vmin;height:42vmin;margin-left:-21vmin;border-radius:50%;background:radial-gradient(circle,#fff6d6 0 30%,rgba(255,225,185,.65) 52%,transparent 72%);animation:glow 6s ease-in-out infinite alternate}
@keyframes glow{to{transform:scale(1.1);opacity:.85}}
.cl{position:absolute;height:5vmin;width:22vmin;background:rgba(255,255,255,.7);border-radius:99px;filter:blur(3px);animation:cd linear infinite}
.cl:before,.cl:after{content:"";position:absolute;background:inherit;border-radius:50%}
.cl:before{width:10vmin;height:10vmin;left:3vmin;top:-5vmin}.cl:after{width:8vmin;height:8vmin;right:3vmin;top:-3.5vmin}
.c1{top:14vh;animation-duration:70s;animation-delay:-20s}.c2{top:27vh;animation-duration:95s;animation-delay:-60s;opacity:.55}.c3{top:7vh;animation-duration:120s;animation-delay:-90s;opacity:.7}
@keyframes cd{from{transform:translateX(-40vmin)}to{transform:translateX(140vw)}}
.land{position:absolute;left:0;bottom:0;width:100%;height:48vh}
.ff{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff3a0;box-shadow:0 0 10px 4px rgba(255,240,150,.8);animation:ffm 8s ease-in-out infinite alternate}
@keyframes ffm{0%{transform:translate(0,0);opacity:.2}50%{opacity:1}100%{transform:translate(var(--dx),-70px);opacity:.3}}
.scene.on{display:block;background:rgba(255,255,255,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:28px;box-shadow:0 12px 40px rgba(60,30,110,.28);margin:12px;width:calc(100% - 24px);max-height:94vh;overflow:auto}
/* ===== Malam, NPC, kembang api ===== */
#fw{z-index:4}
body::before{content:"";position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,#0a0620 0%,#1d1050 45%,#4a2a7a 80%,#7a4a9a 100%);opacity:0;transition:opacity 4s}
body.night::before{opacity:1}
body.night{color:#f3e9ff}
body.night .sun{animation:none;opacity:0}
.sun{transition:opacity 3s}
body.night .cl{opacity:.12!important}
.land{transition:filter 4s}body.night .land{filter:brightness(.4)}
body.night .scene.on{background:rgba(28,14,58,.58)}
.moon{position:absolute;right:12vw;top:9vh;width:14vmin;height:14vmin;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,#f3e6b0 60%,#d9c98a);box-shadow:0 0 40px 10px rgba(255,248,200,.5);opacity:0;transition:opacity 4s 1s}
body.night .moon{opacity:1}
.fade{animation:fi 1.6s both}@keyframes fi{from{opacity:0;transform:translateY(10px)}}
#fbtns .btn{margin:14px 4px 0}
.npc{position:fixed;bottom:1vh;width:min(24vw,100px);z-index:3;pointer-events:none;transition:left 1.6s ease-out,right 1.6s ease-out}
.npc.s{width:min(18vw,80px)}
.npc svg{width:100%;height:auto;animation:jump .6s ease-in-out infinite alternate}@keyframes jump{to{transform:translateY(-16px)}}
.wave2{transform-origin:64px 160px;animation:wv2 .6s infinite alternate ease-in-out}@keyframes wv2{to{transform:rotate(28deg)}}
/* ===== Foto & mode ringan ===== */
.pw{position:relative;display:inline-block;margin:6px 0}
#ph{display:block;width:min(42vw,150px);height:min(42vw,150px);border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 0 0 4px #ff9fd0,0 0 28px 8px rgba(255,150,210,.65)}
#ph.show{animation:popin .8s cubic-bezier(.2,1.6,.4,1)}@keyframes popin{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1)}}
.pw i{position:absolute;font-style:normal;font-size:1.3rem;animation:fh 2.4s ease-in-out infinite alternate}
.pw i:nth-child(2){left:-10px;top:0}.pw i:nth-child(3){right:-10px;top:12px;animation-delay:.5s}.pw i:nth-child(4){left:-6px;bottom:4px;animation-delay:1s}.pw i:nth-child(5){right:-6px;bottom:0;animation-delay:1.5s}
@keyframes fh{to{transform:translateY(-8px) scale(1.2)}}
.done .chibi{display:none}.done h1{font-size:1.35rem}.done .big{font-size:1.05rem}
.lite .pt,.lite .ss,.lite .st{display:none}
.lite .ff:nth-child(odd){display:none}
.lite .cl{filter:none}
.lite .scene.on{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,255,255,.85)}
.lite.night .scene.on{background:rgba(28,14,58,.85)}
.lite.night .land{filter:none;opacity:.5}
</style></head><body>

<script>
const $=id=>document.getElementById(id), dari=(new URLSearchParams(location.search).get("dari")||"").slice(0,30).replace(/[<>&"]/g,"");
const M=["Haloo Mita! 👋 Ada yang spesial hari ini, jangan kabur dulu ya.",
"Hari ini kamu resmi naik level 🎮 Semoga sehat, tangguh , dan kesabarannya penuh!",
"Makasih ya udah jadi sahabat online yang selalu ada, walau cuma lewat layar 💜",
"Kamu tuh kayak wifi yang stabil: ilang sebentar aja langsung dicariin kayaknya hehe ",
"Jangan lupa makan, minum air, dan tidur cukup ya. Aku perhatian nih, serius 🥺",
"Kalau lagi capek atau sedih, cerita aja ke aku. Kapan pun, aku dengerin 🫶",
"Semoga tahun ini penuh hal baik, rezeki lancar, dan semua mimpimu kesampaian ✨",
"Aku nggak bisa traktir kue beneran, jadi kue virtual dulu ya 🎂 Siap tiup lilin?"];
const SAYANG="Sayang banget sama kamu, Mita 💜<br>Makasih udah jadi sahabat online yang paling spesial buatku."; // ganti teks sayang di sini

/* ===== Mode ringan (HP kentang) ===== */
let LITE=/[?&]lite=1/.test(location.search)||(navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory||8)<=3;
function setLite(v){LITE=v;document.body.classList.toggle("lite",v);$("lite").style.opacity=v?1:.6}
setLite(LITE);$("lite").onclick=()=>setLite(!LITE);

/* ===== Suara (dibuat dari kode) ===== */
let AC,master,muted=false;
function initAudio(){
  if(AC){AC.resume();return}
  AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=.5; master.connect(AC.destination);
  const ch=[[261.63,329.63,392],[220,261.63,329.63],[174.61,220,261.63],[196,246.94,293.66]]; let k=0;
  const go=()=>{const t=AC.currentTime; ch[k++%4].forEach(f=>tone(f,t,4.2,.05,"triangle",1))}; go(); setInterval(go,4000);
}
function tone(f,t,d,v=.22,type="sine",a=.01){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}
function bell(f,t,d){tone(f,t,d,.22);tone(f*2,t,d*.6,.08);tone(f*3,t,d*.3,.03)}
function tick(){if(AC)tone(900+Math.random()*300,AC.currentTime,.05,.03)}
function pop(){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(700,t);o.frequency.exponentialRampToValueAtTime(120,t+.15);g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(master);o.start(t);o.stop(t+.2)}
function chime(){if(!AC)return;const t=AC.currentTime;[523.25,659.25,783.99,1046.5].forEach((f,i)=>bell(f,t+i*.09,1.1))}
function blow(){if(!AC)return;const n=AC.sampleRate*.7|0,buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=buf;const f=AC.createBiquadFilter();f.type="bandpass";f.frequency.value=1200;const g=AC.createGain();g.gain.value=.25;s.connect(f);f.connect(g);g.connect(master);s.start()}
const SONG=[[392,.75],[392,.25],[440,1],[392,1],[523.25,1],[494,2],[392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],[392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[494,1],[440,1],[698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,2]];
function song(){if(!AC)return;let t=AC.currentTime+.8;SONG.forEach(([f,b])=>{bell(f,t,b*.8);t+=b*.5})}
function boom(){if(!AC)return;const t=AC.currentTime,n=AC.sampleRate*.9|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=700;const g=AC.createGain();g.gain.value=.55;s.connect(f);f.connect(g);g.connect(master);s.start(t);
const o=AC.createOscillator(),og=AC.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(35,t+.4);og.gain.setValueAtTime(.4,t);og.gain.exponentialRampToValueAtTime(.001,t+.45);o.connect(og);og.connect(master);o.start(t);o.stop(t+.5);
for(let k=0;k<5;k++)tone(2500+Math.random()*2500,t+.1+Math.random()*.5,.04,.03)}
function whistle(){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(500,t);o.frequency.exponentialRampToValueAtTime(1700,t+.7);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.7);o.connect(g);g.connect(master);o.start(t);o.stop(t+.75)}
$("mute").onclick=()=>{muted=!muted;if(master)master.gain.value=muted?0:.5;$("mute").textContent=muted?"🔇":"🔊"};

/* ===== Latar bergerak ===== */
for(let k=0;k<45;k++){const s=document.createElement("i");s.className="st";s.textContent=["✦","✧","♡"][k%3];s.style.cssText=`left:${Math.random()*100}vw;top:${Math.random()*55}vh;animation-delay:${Math.random()*3}s;font-size:${8+Math.random()*12}px`;document.body.appendChild(s)}
for(let k=0;k<16;k++){const p=document.createElement("i");p.className="pt";p.textContent=["🌸","💜","✨","🎀"][k%4];p.style.cssText=`left:${Math.random()*100}vw;font-size:${14+Math.random()*14}px;animation-duration:${9+Math.random()*8}s;animation-delay:-${Math.random()*14}s`;document.body.appendChild(p)}
setInterval(()=>{if(LITE)return;const s=document.createElement("i");s.className="ss";s.style.cssText=`left:${50+Math.random()*50}vw;top:${Math.random()*40}vh`;document.body.appendChild(s);setTimeout(()=>s.remove(),1200)},6000);

for(let k=0;k<22;k++){const f=document.createElement("i");f.className="ff";f.style.cssText=`left:${Math.random()*100}vw;top:${55+Math.random()*38}vh;--dx:${(Math.random()-.5)*90}px;animation-duration:${5+Math.random()*6}s;animation-delay:-${Math.random()*8}s`;document.querySelector(".bg").appendChild(f)}

/* ===== Konfeti & balon ===== */
const c=$("c"),x=c.getContext("2d");let W,H,P=[],cl=0;
function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener("resize",rs);
function burst(){pop();const N=LITE?70:150;for(let n=0;n<N;n++)P.push({x:W/2,y:H*.45,vx:(Math.random()-.5)*15,vy:Math.random()*-15-2,s:5+Math.random()*6,r:Math.random()*6,h:Math.random()*360,l:150})}
let cd=false;
function cloop(t){
  if(LITE&&t-cl<33){requestAnimationFrame(cloop);return}
  cl=t;
  if(P.length||cd){x.clearRect(0,0,W,H);const k=LITE?2:1;P=P.filter(p=>p.l>0);P.forEach(p=>{p.vy+=.25*k;p.x+=p.vx*k;p.y+=p.vy*k;p.r+=.2*k;p.l-=k;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle="hsl("+p.h+",90%,65%)";x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});cd=P.length>0}
  requestAnimationFrame(cloop)}
requestAnimationFrame(cloop);
function balloon(){const b=document.createElement("div");b.className="b";b.textContent=["🎈","🎉","💜","🎁","🌸"][Math.random()*5|0];b.style.left=Math.random()*92+"vw";b.style.animationDuration=(5+Math.random()*4)+"s";document.body.appendChild(b);setTimeout(()=>b.remove(),10000)}

/* ===== Kembang api, hati, LOVE ===== */
const fc=$("fw"),fx=fc.getContext("2d");let FW=[],RK=[];
function frs(){fc.width=innerWidth;fc.height=innerHeight}frs();addEventListener("resize",frs);
function explode(px,py,hue){boom();const n=LITE?45:80,sp=3+Math.random()*3;
  for(let k=0;k<n;k++){const a=Math.PI*2*k/n+Math.random()*.1,v=sp*(.5+Math.random()*.6);FW.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,h:hue+Math.random()*30,l:0,m:70+Math.random()*40,g:.045})}}
function launch(tx){if(RK.length>(LITE?3:8))return;whistle();RK.push({x:tx!=null?tx:innerWidth*(.1+Math.random()*.8),y:innerHeight,ty:innerHeight*(.12+Math.random()*.3),h:Math.random()*360})}
function shape(pts,cx,cy,hue,m){if(FW.length>(LITE?900:2500))return;boom();pts.forEach((q,k)=>FW.push({x:cx,y:cy,tx:cx+q[0],ty:cy+q[1],h:hue+(k%20),l:0,m:m}))}
function heartPts(sc){const a=[],st=LITE?.12:.07;for(let t=0;t<Math.PI*2;t+=st)a.push([16*Math.pow(Math.sin(t),3)*sc,-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*sc]);return a}
function textPts(txt,w,h){const o=document.createElement("canvas");o.width=w;o.height=h;const g=o.getContext("2d");g.fillStyle="#000";g.font="900 "+(h*.8|0)+"px system-ui,sans-serif";g.textAlign="center";g.textBaseline="middle";g.fillText(txt,w/2,h/2);
  const d=g.getImageData(0,0,w,h).data,a=[],st=Math.max(4,(w/(LITE?45:70))|0);for(let yy=0;yy<h;yy+=st)for(let xx=0;xx<w;xx+=st)if(d[(yy*w+xx)*4+3]>128)a.push([xx-w/2,yy-h/2]);return a}
function loveShow(cb){
  const cx=innerWidth/2,cy=innerHeight*.36,sc=Math.min(innerWidth,innerHeight*.9)/42;
  shape(heartPts(sc).concat(heartPts(sc*.6)),cx,cy,330,200);chime();
  setTimeout(()=>{const w=Math.min(innerWidth*.9,600);shape(textPts("LOVE",w|0,(w*.32)|0),cx,cy,45,230);chime();if(cb)setTimeout(cb,1500)},3800)}
let fl=0,slow=0,fd=false;
function floop(t){
  if(LITE&&t-fl<33){requestAnimationFrame(floop);return}
  const dt=t-fl;fl=t;
  if(!LITE&&(RK.length||FW.length)){if(dt>34)slow++;else if(slow>0)slow--;if(slow>45)setLite(true)}
  if(RK.length||FW.length||fd){
    const k=LITE?2:1,e=1-Math.pow(.91,k),dr=Math.pow(.985,k);
    fx.clearRect(0,0,fc.width,fc.height);fx.globalCompositeOperation=LITE?"source-over":"lighter";
    RK=RK.filter(r=>{r.y-=9*k;r.x+=Math.sin(r.y*.05)*.6*k;fx.fillStyle="hsl("+r.h+",100%,75%)";fx.fillRect(r.x,r.y,3,9);if(r.y<=r.ty){explode(r.x,r.y,r.h);return false}return true});
    FW=FW.filter(p=>{p.l+=k;
      if(p.tx!==undefined){
        if(p.l<70){p.x+=(p.tx-p.x)*e;p.y+=(p.ty-p.y)*e}else{p.x=p.tx+Math.sin(p.l*.1+p.tx)*.8;p.y=p.ty+Math.cos(p.l*.1+p.ty)*.8}
        const al=p.l>p.m-60?(p.m-p.l)/60:1;fx.fillStyle="hsla("+p.h+",100%,"+(65+Math.sin(p.l*.3+p.tx)*15)+"%,"+Math.max(al,0)+")";fx.beginPath();fx.arc(p.x,p.y,2.6,0,6.3);fx.fill();
      }else{
        p.vx*=dr;p.vy=p.vy*dr+p.g*k;p.x+=p.vx*k;p.y+=p.vy*k;const al=Math.max(1-p.l/p.m,0);
        fx.strokeStyle="hsla("+p.h+",100%,65%,"+al+")";fx.lineWidth=2;fx.beginPath();fx.moveTo(p.x-p.vx*2,p.y-p.vy*2);fx.lineTo(p.x,p.y);fx.stroke();
      }
      return p.l<p.m});
    fx.globalCompositeOperation="source-over";fd=RK.length>0||FW.length>0}
  requestAnimationFrame(floop)}
requestAnimationFrame(floop);

function npcs(){
  [["#2b1b4d","#ffe08a","#7ad7f0","left",1],["#7a3b2e","#ffb3d9","#9be8a8","right",1],["#f0b84a","#a8c7ff","#ff8fc7","left",19]].forEach((n,k)=>setTimeout(()=>{
    if(LITE&&k===2)return;
    const e=document.createElement("div");e.className="npc"+(k===2?" s":"");e.style[n[3]]="-30vw";e.innerHTML=npcSvg(n[0],n[1],n[2]);document.body.appendChild(e);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{e.style[n[3]]=n[4]+"vw"}))},k*350))}
