<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diary Pribadi — RuangBebas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo">💜 RuangBebas</a>
    <div class="nav-links">
      <a href="index.html">Beranda</a>
      <a href="chat.html">Chat Anonim</a>
      <a href="diary.html" class="active">Diary Pribadi</a>
    </div>
  </div>
</nav>

<main class="container">
  <div class="diary-head">
    <div>
      <h2>📓 Diary Pribadi</h2>
      <p>🔒 Cuma lo yang bisa liat. Tersimpan di browser ini aja, tidak dikirim ke mana-mana.</p>
    </div>
    <div class="diary-pfp">
      <img id="diaryPfp" src="https://api.dicebear.com/9.x/thumbs/svg?seed=RuangBebas" title="PFP lo (sama kayak di chat)">
    </div>
  </div>

  <div class="diary-form card">
    <h3>Tulis hari ini...</h3>
    <div class="row">
      <input type="text" id="diaryTitle" placeholder="Judul (cth: Hari yang melelahkan)">
      <select id="diaryMood">
        <option>💜 Biasa aja</option>
        <option>😊 Senang</option>
        <option>😢 Sedih</option>
        <option>😡 Marah</option>
        <option>😰 Cemas</option>
        <option>😴 Capek</option>
      </select>
    </div>
    <textarea id="diaryText" rows="4" placeholder="Ceritain semuanya di sini, aman..."></textarea>
    <div class="row">
      <label for="diaryImg" class="btn-ghost">🖼️ Tambah Gambar</label>
      <input type="file" id="diaryImg" accept="image/*" hidden>
      <button class="btn-primary" onclick="addDiary()">Simpan ke Diary</button>
    </div>
    <img id="diaryPreview" class="img-preview-big" style="display:none">
  </div>

  <div id="diaryList" class="diary-list"></div>
</main>

<footer>💜 RuangBebas • Diary lo = rahasia lo.</footer>
